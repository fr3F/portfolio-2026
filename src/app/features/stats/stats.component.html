<section
  class="relative flex bg-[#262525] flex-col items-center justify-center py-20 md:py-32 overflow-hidden"
>
  <!-- Effets de lueur décoratifs -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div
      class="absolute top-1/4 left-1/4 w-96 h-96 bg-yellow-400/8 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-yellow-400/8 rounded-full blur-3xl animate-pulse delay-1000"
    ></div>
  </div>

  <!-- Titre -->
  <div class="relative z-10 w-full text-center mb-14 md:mb-20 px-4">
    <h2
      scrub-each-word
      text-split
      data-aos="fade-up"
      data-aos-duration="800"
      class="font-extrabold uppercase tracking-tight text-2xl sm:text-3xl md:text-4xl lg:text-5xl text-white"
    >
      <app-titre />
    </h2>
  </div>

  <!-- Stats -->
  <div class="relative z-10 w-full container mx-auto px-4">
    <div
      data-aos="fade-up"
      data-aos-duration="900"
      data-aos-delay="200"
      class="grid grid-cols-1 sm:grid-cols-3 gap-6 md:gap-8 max-w-5xl mx-auto"
    >
      <!-- Stat 1 -->
      <div
        class="group flex flex-col items-center text-center p-8 md:p-10 rounded-3xl bg-white/5 backdrop-blur-md border border-white/10 hover:border-yellow-400/60 hover:bg-white/10 hover:shadow-[0_0_40px_rgba(250,204,21,0.12)] transition-all duration-500 ease-out hover:-translate-y-2 cursor-default"
      >
        <!-- Icône -->
        <div
          class="mb-5 flex items-center justify-center w-14 h-14 rounded-2xl bg-yellow-400/10 group-hover:bg-yellow-400/20 transition-colors duration-300"
        >
          <svg
            class="w-7 h-7 text-yellow-400"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>

        <h3
          id="exp"
          class="font-extrabold font-outfit text-yellow-400 leading-none text-6xl sm:text-7xl mb-3 tabular-nums"
        >
          +0
        </h3>
        <p
          class="font-outfit text-sm md:text-base font-medium text-gray-400 leading-relaxed max-w-[180px]"
        >
          ans d'expérience en développement web
        </p>
      </div>

      <!-- Stat 2 -->
      <div
        class="group flex flex-col items-center text-center p-8 md:p-10 rounded-3xl bg-white/5 backdrop-blur-md border border-white/10 hover:border-yellow-400/60 hover:bg-white/10 hover:shadow-[0_0_40px_rgba(250,204,21,0.12)] transition-all duration-500 ease-out hover:-translate-y-2 cursor-default"
      >
        <!-- Icône -->
        <div
          class="mb-5 flex items-center justify-center w-14 h-14 rounded-2xl bg-yellow-400/10 group-hover:bg-yellow-400/20 transition-colors duration-300"
        >
          <svg
            class="w-7 h-7 text-yellow-400"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
            />
          </svg>
        </div>

        <h3
          id="hours"
          class="font-extrabold font-outfit text-yellow-400 leading-none text-6xl sm:text-7xl mb-3 tabular-nums"
        >
          0
        </h3>
        <p
          class="font-outfit text-sm md:text-base font-medium text-gray-400 leading-relaxed max-w-[180px]"
        >
          Heures de code accumulées
        </p>
      </div>

      <!-- Stat 3 -->
      <div
        class="group flex flex-col items-center text-center p-8 md:p-10 rounded-3xl bg-white/5 backdrop-blur-md border border-white/10 hover:border-yellow-400/60 hover:bg-white/10 hover:shadow-[0_0_40px_rgba(250,204,21,0.12)] transition-all duration-500 ease-out hover:-translate-y-2 cursor-default"
      >
        <!-- Icône -->
        <div
          class="mb-5 flex items-center justify-center w-14 h-14 rounded-2xl bg-yellow-400/10 group-hover:bg-yellow-400/20 transition-colors duration-300"
        >
          <svg
            class="w-7 h-7 text-yellow-400"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0 0h18"
            />
          </svg>
        </div>

        <h3
          id="tech"
          class="font-extrabold font-outfit text-yellow-400 leading-none text-6xl sm:text-7xl mb-3 tabular-nums"
        >
          0
        </h3>
        <p
          class="font-outfit text-sm md:text-base font-medium text-gray-400 leading-relaxed max-w-[180px]"
        >
          Frameworks & outils maîtrisés
        </p>
      </div>
    </div>
  </div>
</section>
