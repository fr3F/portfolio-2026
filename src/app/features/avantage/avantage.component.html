<section #projetsSection class="projets-section relative overflow-hidden">
  <!-- Fond SVG géométrique moderne -->
  <svg
    class="absolute inset-0 w-full h-full pointer-events-none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <defs>
      <pattern
        id="dots-pattern"
        x="0"
        y="0"
        width="30"
        height="30"
        patternUnits="userSpaceOnUse"
      >
        <circle cx="15" cy="15" r="1.5" fill="#e5e7eb" opacity="0.4" />
      </pattern>
      <pattern
        id="diagonal-lines"
        x="0"
        y="0"
        width="40"
        height="40"
        patternUnits="userSpaceOnUse"
        patternTransform="rotate(45)"
      >
        <line
          x1="0"
          y1="0"
          x2="0"
          y2="40"
          stroke="#f3f4f6"
          stroke-width="1"
          opacity="0.5"
        />
      </pattern>
      <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color: #f9fafb; stop-opacity: 1" />
        <stop offset="50%" style="stop-color: #ffffff; stop-opacity: 1" />
        <stop offset="100%" style="stop-color: #f3f4f6; stop-opacity: 1" />
      </linearGradient>
      <pattern
        id="hexagons"
        x="0"
        y="0"
        width="60"
        height="52"
        patternUnits="userSpaceOnUse"
      >
        <path
          d="M30 0 L52 15 L52 37 L30 52 L8 37 L8 15 Z"
          fill="none"
          stroke="#e5e7eb"
          stroke-width="0.5"
          opacity="0.3"
        />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#bg-gradient)" />
    <rect width="100%" height="100%" fill="url(#dots-pattern)" />
    <rect width="100%" height="100%" fill="url(#hexagons)" opacity="0.5" />
    <circle cx="10%" cy="20%" r="100" fill="#3b82f6" opacity="0.03" />
    <circle cx="85%" cy="70%" r="120" fill="#f59e0b" opacity="0.03" />
    <circle cx="50%" cy="50%" r="80" fill="#10b981" opacity="0.02" />
  </svg>

  <!-- Masques latéraux -->
  <div
    class="absolute left-0 top-0 h-full w-15 sm:w-36 md:w-48 bg-gradient-to-r from-white via-white/70 to-transparent z-20 pointer-events-none"
  ></div>
  <div
    class="absolute right-0 top-0 h-full w-15 sm:w-36 md:w-48 bg-gradient-to-l from-white via-white/70 to-transparent z-20 pointer-events-none"
  ></div>

  <!-- Container animé -->
  <div
    #avantagesContainer
    class="relative z-10 avantages-container flex gap-5 container mx-auto py-8"
  >
    <div
      *ngFor="let skill of skillsDoubled"
      class="border font-outfit border-gray-400 bg-white/80 backdrop-blur-sm px-6 py-2.5 rounded-full text-lg text-gray-600 shadow-sm flex-shrink-0 hover:border-gray-400 hover:text-gray-600 transition-all duration-300"
    >
      {{ skill }}
    </div>
  </div>
</section>
